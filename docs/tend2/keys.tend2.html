# keys: well is the one door a cooperating client asks for a secret
**Goal.** A secret is read from the Keychain at the moment of the call that needs it, handed only to that call, and never printed, logged, written or passed on a command line. `well run --budget <name> --tool <name> --key <sha256> --estimate <usd> --secret <service/account> --env <NAME> -- <command>` reserves, reads the secret, puts it in the child's environment under the name the caller gives, and settles the charge the child writes to the file `WELL_CHARGE` names, or releases when the child writes that it never sent. `well key set <service/account>` generates a secret, stores it by sending the command on the standard input of `security -i`, and reads it back to refuse an empty one. `well key put <service/account>` stores a secret a provider issued, read as one line from standard input with echo off, never from an argument.

## Tried
- 2026-10-27 planned, not built; mull found that piping a value into `security add-generic-password -w` stores an empty password
- 2026-10-26 built on cape-town's order: the six checks were written first and failed for want of the code, then passed. Moving the secret into the child's arguments, or reading it before the reservation, each made a check fail. A keychain created through `security -i` stays off the owner's search list, `security -i` exits non-zero when its command fails, and `ps -E` shows no other process's environment on this macOS. The item is named with `--secret`, because `--key` is the request's sha256 everywhere else (docs/architecture.md)
- 2026-10-27 `well key put` built on cape-town's order: its check was written first and failed. The echo check, run through a pseudo-terminal, caught the first draft asking before echo was off; removing echo-off made it fail again
- 2026-11-04 a release `well run` cannot write is reported: the report says `left_open` with the reason, where before the key stayed blocked in silence. Dropping the report made the check fail
- 2026-11-04 key put's terminal edges: the read runs in a shell that restores the terminal however it ends, asks only once echo is off, and drains a multi-line paste so nothing pending runs in the owner's shell. Tested through a pseudo-terminal; leaving out the drain made the paste check fail. A failing `stty -echo` cannot be made on a real terminal in the suite, so that refusal is untested
- 2026-11-04 the docs now say plainly that the door holds for cooperating clients only (on plotplot's decision): any program running as the owner can read an item well stored, and enforcing more would need a signed program or a locked keychain

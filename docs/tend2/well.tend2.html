# well: one door for every call that costs money or needs a key
**Goal.** Every program the owner runs spends through one shared ledger: it reserves the estimate before a paid call, is refused when the owner's budget would be passed by everything spent and held, settles what was charged, and never resends a call that may already have been charged. The bet holds if the clients that spend on one budget together never pass its cap over a month, and if the month's ledger matches the provider's bill within the size of one call.

**Who.** [The owner](the-owner.tend2.html), whose tools spend money on their own.

**Pain.** Each tool keeps its own cap, so each stays under it while together they overspend. A call that timed out may have been charged, and a naive retry pays twice. Keys sit in environment variables and files where agents can read and print them.

## How well works
The [ledger](ledger.tend2.html) is the first part: one append-only file per budget per month, a directory as the lock, and a rule written once as a test vector in the umbrella that every client passes. The [command](command.tend2.html) is the second, so a client in any language calls well instead of carrying the library. [Keys](keys.tend2.html) are the third, so well is the one door a cooperating client asks for a secret. [Seats](seats.tend2.html), planned, would budget the shared agent window the way the ledger budgets money.

well is a library and a command over files, never a proxy or a server.

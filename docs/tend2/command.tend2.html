# command: reserve, settle and release from any language
**Goal.** `well reserve`, `well settle` and `well release` let a client in any runtime spend through the ledger by calling one command, so the rule has one implementation; `well status` shows a budget's spent, held and cap, and `well breaches` counts the months whose spend passed the cap, which must stay zero. Each prints one JSON line and exits 0 when allowed, 1 when refused and 2 on a usage error, so a caller gates on the exit code.

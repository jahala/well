# the owner: tools that spend money on their own, and no one total
**Who.** A person who builds products alone with a factory of agents. Several of those agents call paid services in the same hour: a judge, a search, a model, later ads and domains. They set what a month may cost, and they want that to hold without watching every run.

It is a morning after an overnight run. Two tools both stayed under their own caps, and the bill is still higher than the owner agreed, because neither knew about the other. One call timed out and was sent again, and the provider charged both.

## Jobs
- When several of my tools spend on one budget, I want them to share one cap, so together they never pass what I agreed. · from the judge door proposal, jahala/cultivate PR 5
- When a paid call fails after it may have been sent, I want it held and never sent again until someone checks the bill, so nothing is paid twice. · from the umbrella's draft of well
- When I set no budget for something, I want no money spent on it, so a missing setting never means unlimited. · from the ledger contract, jahala/plotplot PR 159
